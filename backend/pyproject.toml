[project]
name = "pre-legal-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.160.0",
    "litellm>=1.106.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Lets tests import the `app` package from this directory.
pythonpath = ["."]
